<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Indian Stock Exchange MCP demo</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --line:#262b38; --text:#e6e8ee; --dim:#8b92a5; --acc:#ff9933; --grn:#2ecc71; --red:#ff5c5c; --blu:#5aa9ff; }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  .wrap { max-width:980px; margin:0 auto; padding:28px 24px }
  .bar { display:flex; align-items:center; gap:10px; color:var(--dim); font-size:13px; margin-bottom:18px }
  .dot { width:11px; height:11px; border-radius:50%; background:#3a3f4f } .tri { margin-left:auto }
  .tri span { display:inline-block; width:36px; height:5px; border-radius:2px; margin-left:3px } 
  .prompt { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; min-height:54px }
  .prompt b { color:var(--acc) } .cursor { display:inline-block; width:8px; height:1em; background:var(--text); vertical-align:-2px; animation:blink 1s steps(1) infinite }
  @keyframes blink { 50% { opacity:0 } }
  .call { margin:16px 0 8px; color:var(--dim); opacity:0; transition:opacity .3s } .call.on { opacity:1 }
  .call .tool { color:var(--blu) } .call .ok { color:var(--grn) }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; opacity:0; transition:opacity .3s }
  table.on { opacity:1 } th,td { padding:9px 14px; text-align:right; border-bottom:1px solid var(--line) } th:first-child,td:first-child { text-align:left; color:var(--dim) }
  th { color:var(--acc); font-weight:600 } tr.sec td { color:var(--blu); font-size:12px; letter-spacing:.08em; text-transform:uppercase; background:#12151d }
  tr.row { opacity:0; transition:opacity .25s } tr.row.on { opacity:1 } .best { color:var(--grn); font-weight:700 } .neg { color:var(--red) }
  .foot { margin-top:14px; color:var(--dim); font-size:12px } .tag { color:var(--acc) }
</style></head><body><div class="wrap">
  <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span>indian-stock-exchange-mcp · live output</span>
    <span class="tri"><span style="background:#ff9933"></span><span style="background:#e6e8ee"></span><span style="background:#2ecc71"></span></span></div>
  <div class="prompt"><b>You ›</b> <span id="typed"></span><span class="cursor"></span></div>
  <div class="call" id="call"><span class="tool">⚙ compare-stocks</span> {"names":["TCS","Infosys","Wipro"]} <span class="ok" id="done"></span></div>
  <table id="tbl"><thead id="head"></thead><tbody id="body"></tbody></table>
  <div class="foot" id="foot"></div>
</div>
<script src="demo-data.js"></script>
<script>
const PROMPT = "Compare TCS, Infosys and Wipro on valuation, margins and momentum.";
const d = window.DEMO.compare.result;
const rows = [
  ["Price (NSE, ₹)", s=>s.price.nse, null, v=>v.toLocaleString("en-IN")],
  ["Day change %", s=>s.price.percentChange, "hi", v=>v.toFixed(2)+"%"],
  ["sec","Valuation"],
  ["P/E (TTM)", s=>s.valuation.peTTM, "lo", v=>v.toFixed(1)],
  ["Price / Book", s=>s.valuation.priceToBook, "lo", v=>v.toFixed(1)],
  ["Dividend yield %", s=>s.valuation.dividendYieldPct, "hi", v=>v.toFixed(2)+"%"],
  ["sec","Profitability"],
  ["ROE % (TTM)", s=>s.profitability.roePctTTM, "hi", v=>v.toFixed(1)+"%"],
  ["Net margin %", s=>s.profitability.netMarginPctTTM, "hi", v=>v.toFixed(1)+"%"],
  ["Operating margin %", s=>s.profitability.operatingMarginPctTTM, "hi", v=>v.toFixed(1)+"%"],
  ["sec","Growth & momentum"],
  ["Revenue growth 5y %", s=>s.growth.revenueGrowth5yPct, "hi", v=>v.toFixed(1)+"%"],
  ["Return YTD %", s=>s.performancePct.ytd, "hi", v=>v.toFixed(1)+"%"],
  ["Return 52 weeks %", s=>s.performancePct.fiftyTwoWeek, "hi", v=>v.toFixed(1)+"%"],
];
const names = d.map(s=>s.requested);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
(async()=>{
  const typed = document.getElementById("typed");
  await sleep(900);
  for (const ch of PROMPT) { typed.textContent += ch; await sleep(28); }
  await sleep(600);
  document.getElementById("call").classList.add("on"); await sleep(900);
  document.getElementById("done").textContent = "✓ " + d.length + " companies fetched";
  document.getElementById("head").innerHTML = "<tr><th></th>"+names.map(n=>`<th>${n}</th>`).join("")+"</tr>";
  document.getElementById("tbl").classList.add("on");
  const body = document.getElementById("body");
  for (const r of rows) {
    const tr = document.createElement("tr");
    if (r[0]==="sec") { tr.className="sec row"; tr.innerHTML=`<td colspan="${d.length+1}">${r[1]}</td>`; }
    else {
      const vals = d.map(r[1]); const ok = vals.filter(v=>v!==null);
      const best = r[2]==="hi" ? Math.max(...ok) : r[2]==="lo" ? Math.min(...ok) : null;
      tr.className="row";
      tr.innerHTML = `<td>${r[0]}</td>` + vals.map(v => {
        if (v===null) return "<td>–</td>";
        const cls = v===best ? "best" : (v<0 && r[0].includes("%") ? "neg" : "");
        return `<td class="${cls}">${r[3](v)}</td>`; }).join("");
    }
    body.appendChild(tr); requestAnimationFrame(()=>tr.classList.add("on")); await sleep(r[0]==="sec"?250:420);
  }
  document.getElementById("foot").innerHTML = `<span class="tag">Green</span> = best of the three. Real data from the live server, captured ${window.DEMO.capturedAt.slice(0,10)}. Information only, not investment advice.`;
  window.DEMO_DONE = true;
})();
</script></body></html>
